<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter Viewer - NEXUS REALITY</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .chapter-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
        }

        .chapter-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2rem;
            border-radius: 15px;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .chapter-title {
            font-size: 2.5rem;
            color: white;
            margin-bottom: 0.5rem;
        }

        .chapter-meta {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .meta-badge {
            background: rgba(255,255,255,0.2);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            color: white;
            font-size: 0.9rem;
        }

        .chapter-content {
            background: rgba(255,255,255,0.05);
            padding: 2rem;
            border-radius: 15px;
            margin-bottom: 2rem;
        }

        .section {
            margin-bottom: 3rem;
        }

        .section-title {
            font-size: 1.8rem;
            color: #00d4ff;
            margin-bottom: 1rem;
            padding-bottom: 0.5rem;
            border-bottom: 2px solid #00d4ff;
        }

        .section-content {
            color: #e0e0e0;
            line-height: 1.8;
            font-size: 1.1rem;
        }

        .section-content h3 {
            color: #00ff88;
            margin-top: 1.5rem;
            margin-bottom: 0.8rem;
        }

        .section-content h4 {
            color: #ffd700;
            margin-top: 1.2rem;
            margin-bottom: 0.6rem;
        }

        .formula {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 1rem;
            border-left: 4px solid #00d4ff;
            margin: 1rem 0;
            font-family: 'Courier New', monospace;
            color: #00ff88;
            border-radius: 5px;
        }

        .content-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            background: rgba(0,0,0,0.3);
            border-radius: 10px;
            overflow: hidden;
        }

        .content-table th {
            background: linear-gradient(135deg, #00d4ff, #00a8cc);
            color: #000;
            padding: 1rem;
            font-weight: bold;
        }

        .content-table td {
            padding: 0.8rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            color: #e0e0e0;
        }

        .examples-section, .problems-section {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 2rem;
            border-radius: 15px;
            margin-bottom: 2rem;
        }

        .example-card, .problem-card {
            background: rgba(0,212,255,0.1);
            padding: 1.5rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            border-left: 4px solid #00d4ff;
        }

        .example-title, .problem-question {
            color: #00ff88;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .key-points {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .key-point {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 1rem;
            border-radius: 10px;
            color: white;
        }

        .formulae-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }

        .formula-card {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            padding: 1.5rem;
            border-radius: 10px;
            color: white;
        }

        .formula-name {
            font-weight: bold;
            margin-bottom: 0.5rem;
            font-size: 1.1rem;
        }

        .formula-expression {
            font-family: 'Courier New', monospace;
            font-size: 1.2rem;
            background: rgba(0,0,0,0.2);
            padding: 0.5rem;
            border-radius: 5px;
        }

        .back-button {
            display: inline-block;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #00d4ff, #00a8cc);
            color: #000;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            margin-bottom: 2rem;
            transition: all 0.3s;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,212,255,0.4);
        }

        .loading {
            text-align: center;
            padding: 4rem;
            color: #00d4ff;
            font-size: 1.5rem;
        }

        .error {
            text-align: center;
            padding: 4rem;
            color: #ff4444;
            font-size: 1.5rem;
        }

        @media (max-width: 768px) {
            .chapter-title {
                font-size: 1.8rem;
            }
            
            .chapter-container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="chapter-container">
        <a href="app.html" class="back-button">← Back to All Chapters</a>
        
        <div id="chapter-viewer">
            <div class="loading">Loading chapter...</div>
        </div>
    </div>

    <!-- CRITICAL: Load content-loader.js FIRST -->
    <script src="content-loader.js"></script>
    
    <script>
        // Get chapter ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const chapterId = urlParams.get('id');

        async function loadAndDisplayChapter() {
            const viewer = document.getElementById('chapter-viewer');
            
            if (!chapterId) {
                viewer.innerHTML = '<div class="error">No chapter ID provided!</div>';
                return;
            }

            try {
                // Check if CONTENT_LOADER is available
                if (typeof CONTENT_LOADER === 'undefined') {
                    throw new Error('CONTENT_LOADER is not defined. Make sure content-loader.js is loaded.');
                }

                // Load chapter data
                const chapterData = await CONTENT_LOADER.loadChapter(chapterId);
                
                if (!chapterData) {
                    viewer.innerHTML = '<div class="error">Chapter not found!</div>';
                    return;
                }

                // Display chapter
                displayChapter(chapterData);
            } catch (error) {
                console.error('Error loading chapter:', error);
                viewer.innerHTML = `<div class="error">Error loading chapter: ${error.message}</div>`;
            }
        }

        function displayChapter(chapter) {
            const viewer = document.getElementById('chapter-viewer');
            
            let html = `
                <div class="chapter-header">
                    <h1 class="chapter-title">${chapter.title}</h1>
                    <div class="chapter-meta">
                        <span class="meta-badge">📚 ${chapter.subject}</span>
                        <span class="meta-badge">📂 ${chapter.category}</span>
                        <span class="meta-badge">⭐ ${chapter.difficulty}</span>
                    </div>
                </div>
            `;

            // Sections
            if (chapter.sections && chapter.sections.length > 0) {
                html += '<div class="chapter-content">';
                chapter.sections.forEach(section => {
                    html += `
                        <div class="section">
                            <h2 class="section-title">${section.title}</h2>
                            <div class="section-content">${section.content}</div>
                        </div>
                    `;
                });
                html += '</div>';
            }

            // Examples
            if (chapter.examples && chapter.examples.length > 0) {
                html += `
                    <div class="examples-section">
                        <h2 class="section-title">📝 Worked Examples</h2>
                `;
                chapter.examples.forEach((example, index) => {
                    html += `
                        <div class="example-card">
                            <div class="example-title">Example ${index + 1}: ${example.title}</div>
                            <div><strong>Problem:</strong> ${example.problem}</div>
                            <div style="margin-top: 0.5rem;"><strong>Solution:</strong> ${example.solution}</div>
                        </div>
                    `;
                });
                html += '</div>';
            }

            // Problems
            if (chapter.problems && chapter.problems.length > 0) {
                html += `
                    <div class="problems-section">
                        <h2 class="section-title">🎯 Practice Problems</h2>
                `;
                chapter.problems.forEach((problem, index) => {
                    const correctAnswer = problem.options[problem.correct];
                    html += `
                        <div class="problem-card">
                            <div class="problem-question">Q${index + 1}. ${problem.question}</div>
                            <div style="margin-top: 0.5rem;">
                                ${problem.options.map((opt, i) => `
                                    <div style="padding: 0.3rem 0; color: ${i === problem.correct ? '#00ff88' : '#e0e0e0'};">
                                        ${String.fromCharCode(65 + i)}. ${opt} ${i === problem.correct ? '✓' : ''}
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
            }

            // Key Points
            if (chapter.keyPoints && chapter.keyPoints.length > 0) {
                html += `
                    <div class="chapter-content">
                        <h2 class="section-title">🔑 Key Points</h2>
                        <div class="key-points">
                `;
                chapter.keyPoints.forEach(point => {
                    html += `<div class="key-point">✓ ${point}</div>`;
                });
                html += '</div></div>';
            }

            // Formulae
            if (chapter.formulae && chapter.formulae.length > 0) {
                html += `
                    <div class="chapter-content">
                        <h2 class="section-title">📐 Important Formulae</h2>
                        <div class="formulae-grid">
                `;
                chapter.formulae.forEach(formula => {
                    html += `
                        <div class="formula-card">
                            <div class="formula-name">${formula.name}</div>
                            <div class="formula-expression">${formula.formula}</div>
                        </div>
                    `;
                });
                html += '</div></div>';
            }

            viewer.innerHTML = html;
        }

        // Load chapter when page loads
        window.addEventListener('DOMContentLoaded', loadAndDisplayChapter);
    </script>
</body>
</html>
