<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Chapters - NEXUS REALITY</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .chapters-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
        }

        .page-header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .page-title {
            font-size: 3rem;
            background: linear-gradient(135deg, #00d4ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin: 2rem 0;
            flex-wrap: wrap;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 1.5rem 2rem;
            border-radius: 15px;
            text-align: center;
            min-width: 150px;
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: white;
        }

        .stat-label {
            color: rgba(255,255,255,0.8);
            margin-top: 0.5rem;
        }

        .filter-section {
            background: rgba(255,255,255,0.05);
            padding: 1.5rem;
            border-radius: 15px;
            margin-bottom: 2rem;
        }

        .filter-buttons {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            padding: 0.8rem 1.5rem;
            background: rgba(255,255,255,0.1);
            border: 2px solid #00d4ff;
            color: #00d4ff;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
        }

        .filter-btn:hover, .filter-btn.active {
            background: #00d4ff;
            color: #000;
            transform: translateY(-2px);
        }

        .chapters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }

        .chapter-card {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 2rem;
            border-radius: 15px;
            border: 2px solid transparent;
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .chapter-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #00d4ff, #00ff88);
        }

        .chapter-card:hover {
            border-color: #00d4ff;
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,212,255,0.3);
        }

        .chapter-card.completed::after {
            content: '✓';
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: #00ff88;
            color: #000;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .chapter-number {
            font-size: 0.9rem;
            color: #00d4ff;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }

        .chapter-title {
            font-size: 1.3rem;
            color: white;
            margin-bottom: 1rem;
            font-weight: bold;
        }

        .chapter-meta {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1rem;
        }

        .meta-badge {
            background: rgba(0,212,255,0.2);
            color: #00d4ff;
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            font-size: 0.85rem;
        }

        .chapter-status {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .status-badge {
            display: inline-block;
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .status-complete {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #000;
        }

        .status-coming {
            background: rgba(255,255,255,0.1);
            color: #aaa;
        }

        .search-box {
            width: 100%;
            max-width: 600px;
            margin: 0 auto 2rem;
            padding: 1rem 1.5rem;
            background: rgba(255,255,255,0.1);
            border: 2px solid #00d4ff;
            border-radius: 30px;
            color: white;
            font-size: 1.1rem;
        }

        .search-box::placeholder {
            color: rgba(255,255,255,0.5);
        }

        .back-button {
            display: inline-block;
            padding: 1rem 2rem;
            background: linear-gradient(135deg, #00d4ff, #00a8cc);
            color: #000;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            margin-bottom: 2rem;
            transition: all 0.3s;
        }

        .back-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,212,255,0.4);
        }

        @media (max-width: 768px) {
            .page-title {
                font-size: 2rem;
            }
            
            .chapters-grid {
                grid-template-columns: 1fr;
            }
            
            .chapters-container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="chapters-container">
        <a href="index.html" class="back-button">← Back to Home</a>
        
        <div class="page-header">
            <h1 class="page-title">📚 All Chapters</h1>
            <p style="color: #aaa; font-size: 1.2rem;">51 Complete Chapters for JEE Main + Advanced</p>
        </div>

        <div class="stats-bar" id="stats-bar">
            <!-- Stats will be loaded dynamically -->
        </div>

        <div class="filter-section">
            <input type="text" class="search-box" id="search-box" placeholder="🔍 Search chapters...">
            <div class="filter-buttons" id="filter-buttons">
                <button class="filter-btn active" data-filter="all">All Chapters</button>
                <button class="filter-btn" data-filter="Physics">Physics</button>
                <button class="filter-btn" data-filter="Chemistry">Chemistry</button>
                <button class="filter-btn" data-filter="Mathematics">Mathematics</button>
                <button class="filter-btn" data-filter="completed">Completed Only</button>
            </div>
        </div>

        <div class="chapters-grid" id="chapters-grid">
            <!-- Chapters will be loaded dynamically -->
        </div>
    </div>

    <!-- CRITICAL: Load content-loader.js -->
    <script src="content-loader.js"></script>
    
    <script>
        let currentFilter = 'all';
        let allChapters = [];

        // Load and display chapters
        function loadChapters() {
            if (typeof CONTENT_LOADER === 'undefined') {
                console.error('CONTENT_LOADER not loaded!');
                document.getElementById('chapters-grid').innerHTML = 
                    '<div style="text-align:center;color:#ff4444;padding:3rem;">Error: Content loader not available</div>';
                return;
            }

            // Get all chapters
            allChapters = Object.entries(CONTENT_LOADER.chapters).map(([id, chapter]) => ({
                id,
                ...chapter
            }));

            // Display stats
            displayStats();

            // Display chapters
            displayChapters(allChapters);

            // Setup filters
            setupFilters();

            // Setup search
            setupSearch();
        }

        function displayStats() {
            const stats = CONTENT_LOADER.getStatistics();
            const statsBar = document.getElementById('stats-bar');
            
            statsBar.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${stats.completed}</div>
                    <div class="stat-label">Completed</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${stats.total}</div>
                    <div class="stat-label">Total Chapters</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${stats.percentage}%</div>
                    <div class="stat-label">Coverage</div>
                </div>
            `;
        }

        function displayChapters(chapters) {
            const grid = document.getElementById('chapters-grid');
            
            if (chapters.length === 0) {
                grid.innerHTML = '<div style="text-align:center;color:#aaa;padding:3rem;">No chapters found</div>';
                return;
            }

            grid.innerHTML = chapters.map((chapter, index) => `
                <div class="chapter-card ${chapter.hasContent ? 'completed' : ''}" 
                     onclick="${chapter.hasContent ? `window.location.href='chapter-viewer.html?id=${chapter.id}'` : ''}">
                    <div class="chapter-number">Chapter ${index + 1}</div>
                    <div class="chapter-title">${chapter.title}</div>
                    <div class="chapter-meta">
                        <span class="meta-badge">📚 ${chapter.subject}</span>
                        <span class="meta-badge">📂 ${chapter.category}</span>
                    </div>
                    <div class="chapter-status">
                        <span class="status-badge ${chapter.hasContent ? 'status-complete' : 'status-coming'}">
                            ${chapter.hasContent ? '✓ Available' : '⏳ Coming Soon'}
                        </span>
                    </div>
                </div>
            `).join('');
        }

        function setupFilters() {
            const filterButtons = document.querySelectorAll('.filter-btn');
            
            filterButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    // Update active state
                    filterButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    
                    // Apply filter
                    const filter = btn.dataset.filter;
                    currentFilter = filter;
                    applyFilter();
                });
            });
        }

        function setupSearch() {
            const searchBox = document.getElementById('search-box');
            
            searchBox.addEventListener('input', (e) => {
                applyFilter(e.target.value);
            });
        }

        function applyFilter(searchQuery = '') {
            let filtered = allChapters;

            // Apply subject/status filter
            if (currentFilter !== 'all') {
                if (currentFilter === 'completed') {
                    filtered = filtered.filter(c => c.hasContent);
                } else {
                    filtered = filtered.filter(c => c.subject === currentFilter);
                }
            }

            // Apply search filter
            if (searchQuery) {
                const query = searchQuery.toLowerCase();
                filtered = filtered.filter(c => 
                    c.title.toLowerCase().includes(query) ||
                    c.subject.toLowerCase().includes(query) ||
                    c.category.toLowerCase().includes(query)
                );
            }

            displayChapters(filtered);
        }

        // Load chapters when page loads
        window.addEventListener('DOMContentLoaded', loadChapters);
    </script>
</body>
</html>
